<script>
  const $ = (selector, root) => (root || document).querySelector(selector);
  const PAGE_ROLE = document.body.dataset.portalRole === 'admin' ? 'admin' : 'collector';
  const INSTRUMENTS = [
    { id: 'availability', label: 'Disponibilidad y variedad' },
    { id: 'prices', label: 'Precios' },
  ];
  const STATES = ['Pendiente', 'En curso', 'Completo', 'No aplica', 'Bloqueado'];
  const UNASSIGNED = '__none';
  const TOKEN_KEY = `esporaNuevoEstudioManagementToken:${PAGE_ROLE}`;
  let currentSession = null;
  let collectorNames = [];
  let localCache = [];
  let portfolioCache = [];
  let selectedCodes = new Set();
  let activeOwner = '';
  let detailCode = '';
  let collectorProfile = '';
  let workspace = null;
  let selectedLocalCode = '';
  let researchStatistics = null;

  // ---------- Shared helpers ----------
  function runServer(functionName, ...args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((error) => reject(new Error(error && error.message ? error.message : 'No se pudo completar la operación.')));
      runner[functionName](...args);
    });
  }

  function setBusy(button, busy, label) {
    if (!button) return;
    if (!button.dataset.defaultLabel) button.dataset.defaultLabel = button.textContent;
    button.disabled = busy;
    button.textContent = busy ? label : button.dataset.defaultLabel;
  }

  function showLoginError(message) {
    const error = $('#loginError');
    error.textContent = message;
    error.classList.remove('success');
    error.classList.add('error');
    error.hidden = !message;
  }

  function showLoginSuccess(message) {
    const status = $('#loginError');
    status.textContent = message;
    status.classList.remove('error');
    status.classList.add('success');
    status.hidden = !message;
  }

  function passwordChecks(password) {
    const value = String(password || '');
    return {
      length: Array.from(value).length >= 12,
      letter: /[A-Za-zÀ-ÖØ-öø-ÿ]/.test(value),
      number: /\d/.test(value),
      special: /[^A-Za-zÀ-ÖØ-öø-ÿ0-9\s]/.test(value),
    };
  }

  function updatePasswordRules(password, list) {
    if (!list) return;
    const checks = passwordChecks(password);
    const labels = {
      length: 'Al menos 12 caracteres',
      letter: 'Incluye una letra',
      number: 'Incluye un número',
      special: 'Incluye un carácter especial',
    };
    Object.keys(checks).forEach((rule) => {
      const item = $(`[data-rule="${rule}"]`, list);
      if (item) {
        item.classList.toggle('is-valid', checks[rule]);
        item.textContent = `${labels[rule]}${checks[rule] ? ' — listo' : ''}`;
      }
    });
  }

  function personalPasswordIsValid(password) {
    return Object.values(passwordChecks(password)).every(Boolean);
  }

  function openPasswordReset() {
    const loginEmail = $('#loginEmail');
    const resetEmail = $('#resetEmail');
    resetEmail.value = loginEmail ? loginEmail.value.trim() : '';
    $('#loginView').hidden = true;
    $('#passwordChangeView').hidden = true;
    $('#resetView').hidden = false;
    $('#resetRequestMessage').hidden = true;
    $('#resetError').hidden = true;
    resetEmail.focus();
  }

  function returnToLogin() {
    $('#resetView').hidden = true;
    $('#passwordChangeView').hidden = true;
    $('#loginView').hidden = false;
    $('#loginEmail').focus();
  }

  function submitPasswordChange(event) {
    event.preventDefault();
    const password = $('#changePassword').value;
    const confirmation = $('#changePasswordConfirm').value;
    const error = $('#passwordChangeError');
    if (!personalPasswordIsValid(password)) {
      error.textContent = 'La clave debe cumplir los cuatro requisitos indicados.';
      error.hidden = false;
      return;
    }
    if (password !== confirmation) {
      error.textContent = 'Las claves no coinciden. Vuelve a escribirlas.';
      error.hidden = false;
      $('#changePasswordConfirm').focus();
      return;
    }
    error.hidden = true;
    const button = $('#changePasswordButton');
    setBusy(button, true, 'Guardando…');
    runServer('apiChangePassword', currentSession.token, password, confirmation)
      .then(() => {
        const session = Object.assign({}, currentSession, { mustChange: false });
        $('#passwordChangeForm').reset();
        persistSession(session);
        enterPortal(session);
      })
      .catch((failure) => {
        if (!handleSessionError(failure)) {
          error.textContent = failure.message;
          error.hidden = false;
        }
      })
      .finally(() => setBusy(button, false));
  }

  function requestPasswordReset(event) {
    event.preventDefault();
    const button = $('#resetRequestButton');
    const message = $('#resetRequestMessage');
    message.hidden = true;
    setBusy(button, true, 'Enviando…');
    runServer('apiRequestPasswordReset', $('#resetEmail').value)
      .then((result) => {
        message.textContent = result.message;
        message.classList.remove('error');
        message.hidden = false;
      })
      .catch((failure) => {
        message.textContent = failure.message;
        message.classList.add('error');
        message.hidden = false;
      })
      .finally(() => setBusy(button, false));
  }

  function completePasswordReset(event) {
    event.preventDefault();
    const password = $('#resetPassword').value;
    const confirmation = $('#resetPasswordConfirm').value;
    const error = $('#resetError');
    if (!personalPasswordIsValid(password)) {
      error.textContent = 'La clave debe cumplir los cuatro requisitos indicados.';
      error.hidden = false;
      return;
    }
    if (password !== confirmation) {
      error.textContent = 'Las claves no coinciden. Vuelve a escribirlas.';
      error.hidden = false;
      $('#resetPasswordConfirm').focus();
      return;
    }
    error.hidden = true;
    const button = $('#resetCompleteButton');
    setBusy(button, true, 'Actualizando…');
    runServer('apiCompletePasswordReset', $('#resetEmail').value, $('#resetCode').value, password, confirmation)
      .then((result) => {
        $('#resetCompleteForm').reset();
        $('#resetRequestForm').reset();
        $('#resetView').hidden = true;
        $('#loginView').hidden = false;
        showLoginSuccess(result.message);
        $('#loginEmail').focus();
      })
      .catch((failure) => {
        error.textContent = failure.message;
        error.hidden = false;
      })
      .finally(() => setBusy(button, false));
  }

  function togglePasswordVisibility(event) {
    const button = event.currentTarget;
    const input = document.getElementById(button.dataset.togglePassword);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    button.textContent = show ? 'Ocultar' : 'Mostrar';
    button.setAttribute('aria-label', `${show ? 'Ocultar' : 'Mostrar'} ${button.dataset.togglePassword === 'credential' ? 'clave' : 'contraseña'}`);
    input.focus();
  }

  function showPortalAlert(message, isError) {
    const alert = $('#portalAlert');
    if (!alert) return;
    alert.textContent = message;
    alert.classList.toggle('error-notice', Boolean(isError));
    alert.setAttribute('role', isError ? 'alert' : 'status');
    alert.hidden = !message;
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function addEmptyState(container, message) {
    container.replaceChildren(element('div', 'empty-state', message));
  }

  function showLoadingList(container) {
    const loading = element('div', 'loading-list');
    loading.setAttribute('aria-label', 'Cargando');
    loading.setAttribute('role', 'status');
    loading.append(element('div', 'loading-row'), element('div', 'loading-row'));
    container.replaceChildren(loading);
  }

  function localToday() {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'America/Santiago', year: 'numeric', month: '2-digit', day: '2-digit',
    }).formatToParts(new Date());
    const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
    return `${values.year}-${values.month}-${values.day}`;
  }

  function setDefaultDates() {
    ['#adminDate', '#collectorDate'].forEach((selector) => {
      const input = $(selector);
      if (input && !input.value) input.value = localToday();
    });
  }

  function stateClass(status) {
    return ({
      'En curso': 'state-progress',
      'Completo': 'state-complete',
      'Con registro en captura': 'state-complete',
      'Bloqueado': 'state-blocked',
      'No aplica': 'state-noapply',
      'No requerido': 'state-muted',
      'Sin lectura de captura': 'state-muted',
    })[status] || 'state-pending';
  }

  function captureSummary(item) {
    const capture = item && item.capture;
    if (!capture) return '';
    if (!capture.requiredCount) return 'Sin pautas definidas';
    if (capture.recordedCount === 0) return `Sin pautas aplicadas (0 de ${capture.requiredCount})`;
    if (capture.recordedCount < capture.requiredCount) {
      return `Con pautas pendientes (${capture.recordedCount} de ${capture.requiredCount})`;
    }
    return `Pautas completas (${capture.recordedCount} de ${capture.requiredCount})`;
  }

  function localFieldStatus(item) {
    const value = String((item && item.fieldStatus) || '').trim();
    return value === 'Cerrado' || value === 'Rechazo' ? value : 'Operativo';
  }

  function pendingInstrumentLabels(item) {
    const capture = item && item.capture;
    const required = Array.isArray(item && item.requiredInstruments) ? item.requiredInstruments : [];
    return INSTRUMENTS
      .filter((instrument) => required.includes(instrument.id) && !(capture && capture.instruments && capture.instruments[instrument.id] && capture.instruments[instrument.id].rows > 0))
      .map((instrument) => instrument.label);
  }

  function evidenceBadgeClass(item) {
    const capture = item && item.capture;
    if (!capture || !capture.requiredCount) return 'evidence';
    if (capture.recordedCount === 0) return 'evidence is-unstarted';
    if (capture.recordedCount < capture.requiredCount) return 'evidence is-partial';
    return 'evidence is-recorded';
  }

  function matchesLocalStateFilter(item, filterValue) {
    if (!filterValue) return true;
    const status = localFieldStatus(item);
    const isClosed = status === 'Cerrado';
    const isRejected = status === 'Rechazo';
    const isOperative = !isClosed && !isRejected;
    const requiredCount = item && item.capture
      ? item.capture.requiredCount
      : (Array.isArray(item && item.requiredInstruments) ? item.requiredInstruments.length : 0);
    const recordedCount = item && item.capture ? item.capture.recordedCount : 0;
    switch (filterValue) {
      case 'no_applied':
        return isOperative && recordedCount === 0;
      case 'pending_any':
        return isOperative && requiredCount > 0 && recordedCount < requiredCount;
      case 'pending_partial':
        return isOperative && requiredCount > 0 && recordedCount > 0 && recordedCount < requiredCount;
      case 'complete':
        return isOperative && requiredCount > 0 && recordedCount >= requiredCount;
      case 'closed_or_rejected':
        return isClosed || isRejected;
      case 'closed':
        return isClosed;
      case 'rejected':
        return isRejected;
      case 'operative':
        return isOperative;
      default:
        return true;
    }
  }

  function computeStateCounts(items) {
    const list = Array.isArray(items) ? items : [];
    const counts = {
      total: list.length,
      no_applied: 0,
      pending_any: 0,
      pending_partial: 0,
      complete: 0,
      closed_or_rejected: 0,
      closed: 0,
      rejected: 0,
      operative: 0,
    };
    list.forEach((item) => {
      ['no_applied', 'pending_any', 'pending_partial', 'complete', 'closed_or_rejected', 'closed', 'rejected', 'operative']
        .forEach((key) => {
          if (matchesLocalStateFilter(item, key)) counts[key] += 1;
        });
    });
    return counts;
  }

  function buildStateFilterOptions(items, allLabel) {
    const counts = computeStateCounts(items);
    return [
      new Option(`${allLabel || 'Todos los estados'} (${counts.total})`, ''),
      new Option(`Sin pautas aplicadas · 0 registradas (${counts.no_applied})`, 'no_applied'),
      new Option(`Con pautas pendientes · todos (${counts.pending_any})`, 'pending_any'),
      new Option(`Con pautas pendientes · avance parcial (${counts.pending_partial})`, 'pending_partial'),
      new Option(`Pautas completas (${counts.complete})`, 'complete'),
      new Option(`Cerrado o rechazo (${counts.closed_or_rejected})`, 'closed_or_rejected'),
      new Option(`Solo local cerrado (${counts.closed})`, 'closed'),
      new Option(`Solo rechazo (${counts.rejected})`, 'rejected'),
      new Option(`Solo locales operativos (${counts.operative})`, 'operative'),
    ];
  }

  // ---------- Session ----------
  function persistSession(session) {
    currentSession = session;
    localStorage.setItem(TOKEN_KEY, JSON.stringify(session));
  }

  function clearSessionState(message) {
    currentSession = null;
    workspace = null;
    collectorProfile = '';
    localStorage.removeItem(TOKEN_KEY);
    document.body.classList.remove('is-coordinator');
    $('#sessionBadge').hidden = true;
    $('#portalView').hidden = true;
    $('#passwordChangeView').hidden = true;
    $('#resetView').hidden = true;
    $('#loginView').hidden = false;
    showPortalAlert('', false);
    showLoginError(message || '');
  }

  function handleSessionError(error) {
    if (/expiró o fue revocada/i.test(error.message)) {
      clearSessionState(error.message);
      return true;
    }
    return false;
  }

  function logout() {
    const token = currentSession && currentSession.token;
    if (!token) {
      clearSessionState();
      return;
    }
    const buttons = [...document.querySelectorAll('.logout-button')];
    buttons.forEach((button) => setBusy(button, true, 'Cerrando…'));
    runServer('apiLogout', token)
      .then(() => clearSessionState())
      .catch((error) => showPortalAlert(`No se pudo cerrar la sesión en el servidor: ${error.message}`, true))
      .finally(() => buttons.forEach((button) => setBusy(button, false)));
  }

  function enterPortal(session) {
    persistSession(session);
    $('#resetView').hidden = true;
    if (session.mustChange) {
      $('#loginView').hidden = true;
      $('#portalView').hidden = true;
      $('#passwordChangeView').hidden = false;
      $('#passwordChangeForm').reset();
      $('#passwordChangeError').hidden = true;
      updatePasswordRules('', $('#passwordRules'));
      return;
    }
    $('#passwordChangeView').hidden = true;
    $('#loginView').hidden = true;
    setDefaultDates();
    if (PAGE_ROLE === 'admin') {
      if (session.role !== 'admin' && session.role !== 'coordinator') {
        clearSessionState('Esta sesión no corresponde a administración.');
        return;
      }
      const coordinator = session.role === 'coordinator';
      document.body.classList.toggle('is-coordinator', coordinator);
      $('#sessionBadge').hidden = false;
      $('#sessionBadge').textContent = `${session.name} · ${coordinator ? 'Coordinación' : 'Administración'}`;
      $('#portalView').hidden = false;
      loadAdminData();
      return;
    }
    if (session.role !== 'collector') {
      clearSessionState('Esta sesión no corresponde al equipo de terreno.');
      return;
    }
    collectorProfile = session.name;
    $('#sessionBadge').hidden = false;
    $('#sessionBadge').textContent = collectorProfile;
    $('#collectorHeading').textContent = `Hola, ${collectorProfile.split(' ')[0]}`;
    $('#portalView').hidden = false;
    loadWorkspace();
  }

  // ---------- Admin: data ----------
  function loadAdminData(successMessage) {
    if (!currentSession || PAGE_ROLE !== 'admin') return Promise.resolve();
    const assignments = $('#adminAssignments');
    showLoadingList(assignments);
    if (!portfolioCache.length) showLoadingList($('#universeList'));
    $('#researchType').disabled = true;
    $('#refreshResearch').disabled = true;
    $('#refreshResearch').onclick = () => loadAdminData();
    $('#researchStatus').hidden = false;
    $('#researchStatus').textContent = 'Actualizando resultados…';
    return runServer('apiGetAdminData', currentSession.token, $('#adminDate').value)
      .then((data) => {
        if (!data || !Array.isArray(data.locals) || !Array.isArray(data.portfolio) || !Array.isArray(data.assignments)) {
          throw new Error('El servidor devolvió datos incompletos. Comprueba que Code.gs y las plantillas sean de la misma versión.');
        }
        if (!data.operations || !data.operations.overdueAssignments || !Array.isArray(data.proposals)) {
          throw new Error('Falta el resumen operativo o las propuestas. Actualiza Code.gs y las plantillas del portal a la misma versión.');
        }
        collectorNames = data.collectors.slice();
        localCache = data.locals;
        portfolioCache = data.portfolio;
        selectedCodes = new Set([...selectedCodes].filter((code) => portfolioCache.some((item) => item.code === code)));
        populateAdminControls();
        renderBoard();
        renderOperationalDashboard(data);
        renderConsolidatedSyncStatus(Boolean(data.operations.consolidatedDecisionsSynced));
        renderResearchStatistics(data.capture);
        renderAdminAssignments(data.assignments);
        renderAdminProposals(data.proposals);
        renderAccess(data.access);
        if (data.capture && !data.capture.available) {
          showPortalAlert(`La cartera se cargó, pero sin estado de captura: ${data.capture.message}`, true);
        } else {
          showPortalAlert(typeof successMessage === 'string' ? successMessage : '', false);
        }
      })
      .catch((error) => {
        if (handleSessionError(error)) return;
        researchStatistics = null;
        renderResearchStatistics({ available: false, message: error.message });
        addEmptyState(assignments, 'No fue posible cargar las asignaciones. Comprueba la conexión y vuelve a intentar.');
        showPortalAlert(error.message, true);
      })
      .finally(() => { $('#refreshResearch').disabled = false; });
  }

  function researchRatio(numerator, denominator) {
    if (!denominator) return '— (sin base)';
    return `${(100 * numerator / denominator).toLocaleString('es-CL', { maximumFractionDigits: 1 })} % (${numerator}/${denominator})`;
  }

  function researchTable(root, caption, headers, rows, emptyMessage) {
    root.replaceChildren();
    if (!rows.length) {
      addEmptyState(root, emptyMessage || 'Sin respuestas válidas para este grupo.');
      return;
    }
    const table = element('table', 'dashboard-table');
    table.append(element('caption', '', caption));
    const head = document.createElement('thead');
    const header = document.createElement('tr');
    headers.forEach((label) => {
      const cell = element('th', '', label);
      cell.scope = 'col';
      header.append(cell);
    });
    head.append(header);
    const body = document.createElement('tbody');
    rows.forEach((values) => {
      const row = document.createElement('tr');
      values.forEach((value, index) => {
        const cell = element(index ? 'td' : 'th', '', String(value));
        if (!index) cell.scope = 'row';
        row.append(cell);
      });
      body.append(row);
    });
    table.append(head, body);
    const scroll = element('div', 'dashboard-table-scroll');
    scroll.tabIndex = 0;
    scroll.setAttribute('role', 'region');
    scroll.setAttribute('aria-label', caption);
    scroll.append(table);
    root.append(scroll);
  }

  function renderResearchStatistics(capture) {
    const selector = $('#researchType');
    const previous = selector.value;
    researchStatistics = capture?.available ? capture.statistics : null;
    const status = $('#researchStatus');
    if (!researchStatistics) {
      status.hidden = false;
      status.textContent = capture?.available
        ? 'Resultados no disponibles. Actualiza Code.gs y las plantillas del portal a la misma versión.'
        : `Resultados no disponibles: ${capture?.message || 'sin lectura de la captura.'}`;
      selector.disabled = true;
      selector.replaceChildren(element('option', '', 'Sin resultados disponibles'));
      ['researchClassification', 'researchAvailability', 'researchPrices', 'researchOrigins'].forEach((id) =>
        addEmptyState($(`#${id}`), 'Sin resultados disponibles.'));
      $('#researchSample').textContent = '';
      $('#researchOriginsSummary').textContent = '';
      return;
    }
    status.hidden = !researchStatistics.warnings.length;
    status.textContent = researchStatistics.warnings.join(' ');
    const classification = researchStatistics.classification;
    if (researchStatistics.available.classification) {
      researchTable($('#researchClassification'), 'Clasificación final · locales con visita',
        ['Resultado', 'Locales', '% de locales'],
        classification.total ? Object.entries(classification.counts).map(([label, count]) =>
          [label, count, researchRatio(count, classification.total)]) : []);
    } else {
      addEmptyState($('#researchClassification'), 'Clasificación no disponible: faltan la hoja o sus encabezados.');
    }
    selector.replaceChildren(...researchStatistics.groups.map((group) => {
      const option = element('option', '', group.label);
      option.value = group.label;
      return option;
    }));
    selector.disabled = !researchStatistics.groups.length;
    if (researchStatistics.groups.some((group) => group.label === previous)) selector.value = previous;
    selector.onchange = renderResearchGroup;
    renderResearchGroup();
  }

  function renderResearchGroup() {
    const group = researchStatistics?.groups.find((entry) => entry.label === $('#researchType').value);
    $('#researchSample').textContent = group
      ? `${group.locals} ${group.locals === 1 ? 'local' : 'locales'} con visita · ${group.availabilityLocals} con pauta de disponibilidad`
      : 'Sin locales con visitas registradas.';
    $('#researchOriginsSummary').textContent = '';
    const available = researchStatistics?.available || {};
    if (!group || !available.availability) {
      addEmptyState($('#researchAvailability'), group ? 'Disponibilidad no disponible: faltan la hoja o sus encabezados.' : 'Sin respuestas registradas.');
    } else {
      const totalYes = group.healthy.yes + group.unhealthy.yes;
      researchTable($('#researchAvailability'), `Disponibilidad · ${group.label}`,
        ['Grupo de ítems', 'Disponibles', 'Respuestas válidas', '% disponibilidad', '% composición'],
        [['Saludables', group.healthy], ['No saludables', group.unhealthy]].map(([label, stats]) =>
          [label, stats.yes, stats.valid, researchRatio(stats.yes, stats.valid), researchRatio(stats.yes, totalYes)]));
    }
    if (!group || !available.prices) {
      addEmptyState($('#researchPrices'), group ? 'Precios no disponibles: faltan la hoja o sus encabezados.' : 'Sin respuestas registradas.');
    } else {
      const money = (value) => value.toLocaleString('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 });
      researchTable($('#researchPrices'), `Precios en CLP · ${group.label}`,
        ['Producto', 'Unidad', 'Locales', 'n valores', 'Mínimo', 'Máximo', 'Media', 'Mediana'],
        group.prices.map((item) => [item.product, item.unit, item.locals, item.samples,
          money(item.min), money(item.max), money(item.mean), money(item.median)]),
        'Sin precios válidos en unidades comparables para este grupo.');
    }
    if (!group || !available.origins) {
      addEmptyState($('#researchOrigins'), group ? 'Origen no disponible: faltan la hoja o sus encabezados.' : 'Sin respuestas registradas.');
    } else {
      $('#researchOriginsSummary').textContent =
        `Con productos regionales: ${researchRatio(group.regionalLocals, group.originLocals)} · Sin productos regionales observados: ${researchRatio(group.noneLocals, group.originLocals)} · Sin declaración válida: ${group.locals - group.originLocals} locales.`;
      researchTable($('#researchOrigins'), `Origen regional reportado · ${group.label}`,
        ['Categoría', 'Comuna reportada', 'Evidencia', 'Productos', 'Locales', '% de productos'],
        group.origins.map((item) => [item.category, item.commune, item.source, item.count, item.locals,
          researchRatio(item.count, group.originItems)]), 'Sin productos regionales reportados para este grupo.');
    }
  }

  function renderOperationalDashboard(data) {
    const metrics = $('#dashboardMetrics');
    const overdue = data.operations.overdueAssignments;
    const assigned = portfolioCache.filter((item) => item.collector);
    const unassignedCount = portfolioCache.length - assigned.length;
    const captureAvailable = Boolean(data.capture && data.capture.available);
    const closedCount = portfolioCache.filter((item) => localFieldStatus(item) === 'Cerrado').length;
    const rejectedCount = portfolioCache.filter((item) => localFieldStatus(item) === 'Rechazo').length;
    const incidentCount = closedCount + rejectedCount;
    const operativePortfolio = portfolioCache.filter((item) => localFieldStatus(item) === 'Operativo');
    const required = operativePortfolio.flatMap((item) => INSTRUMENTS
      .filter((instrument) => item.requiredInstruments.includes(instrument.id))
      .map((instrument) => ({ item, instrument })));
    const recorded = captureAvailable
      ? required.filter(({ item, instrument }) => item.capture?.instruments?.[instrument.id]?.rows > 0).length
      : null;
    const missing = recorded === null ? null : required.length - recorded;
    const withVisits = captureAvailable ? assigned.filter((item) => item.capture?.visits > 0).length : null;
    const noAppliedLocals = captureAvailable
      ? operativePortfolio.filter((item) => (item.capture?.recordedCount || 0) === 0).length
      : null;
    const pendingLocals = captureAvailable
      ? operativePortfolio.filter((item) => item.capture?.requiredCount > 0 && item.capture.recordedCount < item.capture.requiredCount).length
      : null;
    const complete = captureAvailable
      ? operativePortfolio.filter((item) => item.capture?.requiredCount > 0 && item.capture.recordedCount >= item.capture.requiredCount).length
      : null;
    const partial = captureAvailable
      ? operativePortfolio.filter((item) => item.capture?.recordedCount > 0 && item.capture.recordedCount < item.capture.requiredCount).length
      : null;

    $('#dashboardAsOf').textContent = `Corte de programaciones: ${overdue.asOf || '—'}`;
    const notice = $('#dashboardNotice');
    notice.hidden = captureAvailable;
    notice.textContent = captureAvailable
      ? ''
      : `El resumen de avance no está disponible porque no se pudo leer la planilla de captura. ${data.capture?.message || ''}`;
    metrics.replaceChildren(
      dashboardMetric('Locales en cartera', portfolioCache.length, `${assigned.length} con responsable · ${unassignedCount} sin asignar`),
      dashboardMetric('Sin pautas aplicadas', noAppliedLocals === null ? '—' : noAppliedLocals, noAppliedLocals === null ? 'Sin lectura de captura' : 'Locales operativos con 0 pautas', noAppliedLocals ? 'metric-attention' : ''),
      dashboardMetric('Con pautas pendientes', pendingLocals === null ? '—' : pendingLocals, pendingLocals === null ? 'Sin lectura de captura' : `${partial || 0} en avance parcial · ${missing} pautas faltantes`, pendingLocals ? 'metric-attention' : ''),
      dashboardMetric('Cerrados o rechazo', incidentCount, `${closedCount} cerrados · ${rejectedCount} con rechazo`, incidentCount ? 'metric-attention' : ''),
      dashboardMetric('Programaciones pasadas', overdue.count, 'Con pautas todavía pendientes', overdue.count ? 'metric-attention' : '')
    );

    renderInstrumentCoverage(captureAvailable);
    renderCollectorProgress(captureAvailable, withVisits, complete, partial);
    renderDashboardSuggestions({
      captureAvailable,
      unassignedCount,
      missing,
      noVisitCount: noAppliedLocals,
      partialCount: partial,
      incidentCount,
      closedCount,
      rejectedCount,
      overdueCount: overdue.count,
      required,
    });
    renderOverdueAssignments(overdue);
    renderDashboardTiming(data.capture?.timing, captureAvailable, data.capture?.message || '');
  }

  function formatDashboardDuration(seconds) {
    if (seconds == null || seconds === '' || !Number.isFinite(Number(seconds)) || Number(seconds) < 0) return '—';
    const total = Math.round(Number(seconds));
    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const remainingSeconds = total % 60;
    if (hours) return `${hours} h ${minutes} min`;
    if (minutes) return `${minutes} min ${remainingSeconds} s`;
    return `${remainingSeconds} s`;
  }

  function renderDashboardTiming(timing, captureAvailable, captureMessage) {
    const averages = $('#dashboardInstrumentTimes');
    const visitAverage = $('#dashboardVisitTimeAverage');
    const recent = $('#dashboardRecentVisitTimes');
    if (!captureAvailable) {
      addEmptyState(averages, `Tiempos no disponibles: ${captureMessage || 'no se pudo leer la planilla de captura.'}`);
      addEmptyState(visitAverage, 'Promedio total no disponible.');
      addEmptyState(recent, 'Visitas con tiempo no disponibles.');
      return;
    }
    if (!timing?.available) {
      const message = 'La hoja Visitas aún no tiene las columnas de tiempo. Actualice y despliegue el Apps Script de captura; se agregarán al guardar una pauta.';
      addEmptyState(averages, message);
      addEmptyState(visitAverage, message);
      addEmptyState(recent, message);
      return;
    }

    const instrumentLabels = {
      availability: 'Disponibilidad y variedad',
      prices: 'Precios',
    };
    const table = document.createElement('table');
    table.className = 'dashboard-table';
    const head = document.createElement('thead');
    const header = document.createElement('tr');
    ['Instrumento', 'Promedio', 'Muestras'].forEach((label) => header.append(element('th', '', label)));
    head.append(header);
    const body = document.createElement('tbody');
    Object.entries(instrumentLabels).forEach(([id, label]) => {
      const value = timing.instrumentAverages?.[id] || {};
      const row = document.createElement('tr');
      [label, formatDashboardDuration(value.averageSeconds), String(value.samples || 0)]
        .forEach((cell) => row.append(element('td', '', cell)));
      body.append(row);
    });
    table.append(head, body);
    averages.replaceChildren(table);

    visitAverage.replaceChildren();
    if (timing.visitSamples) {
      visitAverage.append(
        element('strong', '', formatDashboardDuration(timing.visitAverageSeconds)),
        element('span', '', `Promedio total por visita · ${timing.visitSamples} visitas con medición`)
      );
    } else {
      addEmptyState(visitAverage, 'Todavía no hay pautas guardadas con tiempo medido.');
    }

    if (!timing.recentVisits?.length) {
      addEmptyState(recent, 'Las visitas con medición aparecerán aquí al guardar pautas.');
      return;
    }
    const recentTable = document.createElement('table');
    recentTable.className = 'dashboard-table timing-table';
    const recentHead = document.createElement('thead');
    const recentHeader = document.createElement('tr');
    ['Fecha', 'Local', 'Aplicador/a', 'Disponibilidad y variedad', 'Precios', 'Total visita']
      .forEach((label) => recentHeader.append(element('th', '', label)));
    recentHead.append(recentHeader);
    const recentBody = document.createElement('tbody');
    timing.recentVisits.forEach((visit) => {
      const row = document.createElement('tr');
      const local = visit.localName ? `${visit.localCode} · ${visit.localName}` : visit.localCode;
      [
        visit.observationDate || '—',
        local,
        visit.collector || '—',
        formatDashboardDuration(visit.durations?.availability),
        formatDashboardDuration(visit.durations?.prices),
        formatDashboardDuration(visit.totalDurationSeconds),
      ].forEach((value) => row.append(element('td', '', String(value))));
      recentBody.append(row);
    });
    recentTable.append(recentHead, recentBody);
    const scroll = element('div', 'dashboard-table-scroll');
    scroll.append(recentTable);
    recent.replaceChildren(scroll);
  }

  function dashboardMetric(label, value, detail, className) {
    const card = element('article', `dashboard-metric${className ? ` ${className}` : ''}`);
    card.append(element('span', 'dashboard-metric-label', label));
    card.append(element('strong', 'dashboard-metric-value', String(value)));
    card.append(element('span', 'dashboard-metric-detail', detail));
    return card;
  }

  function renderInstrumentCoverage(captureAvailable) {
    const root = $('#dashboardInstrumentCoverage');
    if (!captureAvailable) {
      addEmptyState(root, 'Cobertura no disponible hasta recuperar la lectura de captura.');
      return;
    }
    const rows = INSTRUMENTS.map((instrument) => {
      const requiredItems = portfolioCache.filter((item) => item.requiredInstruments.includes(instrument.id));
      const done = requiredItems.filter((item) => item.capture?.instruments?.[instrument.id]?.rows > 0).length;
      const row = element('div', 'coverage-row');
      const heading = element('div', 'coverage-heading');
      heading.append(element('strong', '', instrument.label));
      heading.append(element('span', '', requiredItems.length ? `${done} de ${requiredItems.length} locales` : 'Sin pauta requerida'));
      row.append(heading);
      if (requiredItems.length) {
        const bar = element('div', 'coverage-track');
        bar.setAttribute('role', 'img');
        bar.setAttribute('aria-label', `${instrument.label}: ${done} de ${requiredItems.length} locales con registro`);
        const fill = element('span', 'coverage-fill');
        fill.style.width = `${Math.round(done / requiredItems.length * 100)}%`;
        bar.append(fill);
        row.append(bar);
      }
      return row;
    });
    root.replaceChildren(...rows);
  }

  function renderCollectorProgress(captureAvailable, withVisits, complete, partial) {
    const root = $('#dashboardCollectorProgress');
    const people = [...collectorNames, UNASSIGNED];
    const table = document.createElement('table');
    table.className = 'dashboard-table';
    const head = document.createElement('thead');
    const headerRow = document.createElement('tr');
    ['Responsable', 'Locales', 'Sin pautas', 'Parciales', 'Con pendientes', 'Completos', 'Cerrado/Rechazo', 'Pautas sin registro']
      .forEach((label) => headerRow.append(element('th', '', label)));
    head.append(headerRow);
    const body = document.createElement('tbody');
    people.forEach((person) => {
      const rows = portfolioCache.filter((item) => ownerKey(item) === person);
      const operativeRows = rows.filter((item) => localFieldStatus(item) === 'Operativo');
      const incidents = rows.length - operativeRows.length;
      const noApplied = captureAvailable
        ? operativeRows.filter((item) => (item.capture?.recordedCount || 0) === 0).length
        : null;
      const partialRows = captureAvailable
        ? operativeRows.filter((item) => item.capture?.recordedCount > 0 && item.capture.recordedCount < item.capture.requiredCount).length
        : null;
      const withPending = captureAvailable
        ? operativeRows.filter((item) => item.capture?.requiredCount > 0 && item.capture.recordedCount < item.capture.requiredCount).length
        : null;
      const completed = captureAvailable
        ? operativeRows.filter((item) => item.capture?.requiredCount > 0 && item.capture.recordedCount >= item.capture.requiredCount).length
        : null;
      const pendingPautas = captureAvailable
        ? operativeRows.reduce((total, item) => total + Math.max(0, (item.capture?.requiredCount || 0) - (item.capture?.recordedCount || 0)), 0)
        : null;
      const row = document.createElement('tr');
      [
        person === UNASSIGNED ? 'Sin asignar' : person,
        rows.length,
        noApplied === null ? '—' : noApplied,
        partialRows === null ? '—' : partialRows,
        withPending === null ? '—' : withPending,
        completed === null ? '—' : completed,
        incidents,
        pendingPautas === null ? '—' : pendingPautas,
      ].forEach((value) => row.append(element('td', '', String(value))));
      body.append(row);
    });
    const operativeAll = portfolioCache.filter((item) => localFieldStatus(item) === 'Operativo');
    const totalNoApplied = captureAvailable
      ? operativeAll.filter((item) => (item.capture?.recordedCount || 0) === 0).length
      : null;
    const totalWithPending = captureAvailable
      ? operativeAll.filter((item) => item.capture?.requiredCount > 0 && item.capture.recordedCount < item.capture.requiredCount).length
      : null;
    const totalIncidents = portfolioCache.length - operativeAll.length;
    const totalRow = document.createElement('tr');
    totalRow.className = 'dashboard-total-row';
    [
      'Total',
      portfolioCache.length,
      totalNoApplied === null ? '—' : totalNoApplied,
      captureAvailable ? partial : '—',
      totalWithPending === null ? '—' : totalWithPending,
      complete === null ? '—' : complete,
      totalIncidents,
      captureAvailable ? operativeAll.reduce((total, item) => total + Math.max(0, (item.capture?.requiredCount || 0) - (item.capture?.recordedCount || 0)), 0) : '—',
    ].forEach((value) => totalRow.append(element('td', '', String(value))));
    body.append(totalRow);
    table.append(head, body);
    root.replaceChildren(table);
  }

  function renderDashboardSuggestions(summary) {
    const list = $('#dashboardSuggestions');
    const suggestions = [];
    if (summary.unassignedCount) {
      suggestions.push(`${summary.unassignedCount} locales siguen sin responsable. Revise la distribución antes de programar nuevas salidas.`);
    }
    if (summary.incidentCount) {
      suggestions.push(`${summary.incidentCount} ${summary.incidentCount === 1 ? 'local figura' : 'locales figuran'} con incidencia en terreno (${summary.closedCount} cerrados y ${summary.rejectedCount} con rechazo). Revise el listado en «Distribución de la cartera» para confirmar o reasignar.`);
    }
    if (!summary.captureAvailable) {
      suggestions.push('El avance de captura no se puede evaluar en esta actualización; verifique permisos y disponibilidad de la planilla de respuestas.');
    } else {
      if (summary.noVisitCount) {
        suggestions.push(`${summary.noVisitCount} locales operativos aún no tienen pautas aplicadas (0 registradas). Use el filtro «Sin pautas aplicadas» para priorizar su salida.`);
      }
      if (summary.partialCount) {
        suggestions.push(`${summary.partialCount} locales ya iniciados tienen pautas pendientes por completar. Use el filtro «Con pautas pendientes · avance parcial» antes de cerrar su levantamiento.`);
      } else if (summary.missing) {
        suggestions.push(`${summary.missing} pautas requeridas no tienen registros. Confirme si la visita está pendiente o si falta sincronizar la captura.`);
      }
      const coverage = summary.required.map(({ instrument }) => instrument.id)
        .filter((id, index, all) => all.indexOf(id) === index)
        .map((id) => {
          const instrument = INSTRUMENTS.find((item) => item.id === id);
          const total = portfolioCache.filter((item) => localFieldStatus(item) === 'Operativo' && item.requiredInstruments.includes(id)).length;
          const done = portfolioCache.filter((item) => localFieldStatus(item) === 'Operativo' && item.requiredInstruments.includes(id) && item.capture?.instruments?.[id]?.rows > 0).length;
          return { label: instrument.label, total, done, rate: total ? done / total : 1 };
        }).filter((item) => item.total);
      if (coverage.length) {
        coverage.sort((a, b) => a.rate - b.rate || a.label.localeCompare(b.label, 'es'));
        if (coverage[0].rate < 1) {
          suggestions.push(`La pauta con menor cobertura es ${coverage[0].label} (${coverage[0].done} de ${coverage[0].total}). Puede ser el foco de la próxima revisión de terreno.`);
        }
      }
    }
    if (summary.overdueCount) {
      suggestions.push(`${summary.overdueCount} programaciones tienen fecha pasada y pautas aún pendientes según el estado manual. Confirme con la persona responsable y actualice los estados.`);
    }
    if (!suggestions.length) suggestions.push('No hay señales operativas pendientes en los datos disponibles. Mantenga la actualización de cartera y estados al día.');
    list.replaceChildren(...suggestions.map((text) => element('li', '', text)));
  }

  function renderOverdueAssignments(overdue) {
    const root = $('#dashboardOverdue');
    if (!overdue.count) {
      addEmptyState(root, 'No hay programaciones pasadas con pautas pendientes.');
      return;
    }
    const list = document.createElement('ul');
    list.className = 'overdue-list';
    overdue.items.forEach((item) => {
      const row = document.createElement('li');
      const localName = item.localName ? ` · ${item.localName}` : '';
      row.append(
        element('strong', '', `${item.date} · ${item.localCode}${localName}`),
        element('span', '', `${item.collector || 'Sin aplicador'} · Pendiente: ${item.pendingInstruments.join(', ')}`)
      );
      list.append(row);
    });
    root.replaceChildren(list);
    if (overdue.count > overdue.items.length) {
      root.append(element('p', 'dashboard-method', `Se muestran ${overdue.items.length} de ${overdue.count} programaciones. Actualice la cartera para revisar el resto.`));
    }
  }

  function populateAdminControls() {
    const currentCategory = $('#portfolioCategoryFilter').value;

    const categories = [...new Set(localCache.flatMap((local) =>
      [local.category, local.subcategory].map((value) => String(value || '').trim()).filter(Boolean)
    ))].sort((a, b) => a.localeCompare(b, 'es'));
    const categoryOptions = () => [
      new Option('Todos los tipos', ''),
      ...categories.map((category) => new Option(category, category)),
    ];
    $('#portfolioCategoryFilter').replaceChildren(...categoryOptions());
    $('#localCategoryFilter').replaceChildren(...categoryOptions());
    if (categories.includes(currentCategory)) $('#portfolioCategoryFilter').value = currentCategory;
    if (categories.includes(currentLocalCategory)) $('#localCategoryFilter').value = currentLocalCategory;

    const portfolioStateFilter = $('#portfolioStateFilter');
    if (portfolioStateFilter) {
      const currentPortfolioState = portfolioStateFilter.value;
      portfolioStateFilter.replaceChildren(...buildStateFilterOptions(portfolioCache, 'Todos los estados'));
      portfolioStateFilter.value = currentPortfolioState;
    }

    const localStateFilter = $('#localStateFilter');
    if (localStateFilter) {
      const currentLocalState = localStateFilter.value;
      localStateFilter.replaceChildren(...buildStateFilterOptions(localCache, 'Todos los estados'));
      localStateFilter.value = currentLocalState;
    }

    const ownerFilter = $('#ownerFilter');
    const currentOwner = ownerFilter.value;
    ownerFilter.replaceChildren(
      new Option('Todas las personas', ''),
      new Option('Sin asignar', UNASSIGNED),
      ...collectorNames.map((name) => new Option(name, name))
    );
    ownerFilter.value = currentOwner;

    const bulk = $('#bulkCollector');
    const ownerOptions = () => [...collectorNames.map((name) => new Option(name, name)), new Option('Sin asignar', UNASSIGNED)];
    bulk.replaceChildren(new Option('Mover selección a…', ''), ...ownerOptions());
    $('#detailOwnerMove').replaceChildren(new Option('Mover este local a…', ''), ...ownerOptions());

    const collector = $('#assignmentCollector');
    const selectedCollector = collector.value;
    collector.replaceChildren(new Option('Selecciona aplicador/a', ''), ...collectorNames.map((name) => new Option(name, name)));
    if (collectorNames.includes(selectedCollector)) collector.value = selectedCollector;
    updateLocalOptions();
  }

  // ---------- Admin: drag & drop board ----------
  function ownerKey(item) {
    return item.collector || UNASSIGNED;
  }

  function filteredUniverse() {
    const query = $('#portfolioSearch').value.trim().toLocaleLowerCase('es');
    const owner = $('#ownerFilter').value;
    const category = $('#portfolioCategoryFilter').value;
    const stateFilter = $('#portfolioStateFilter') ? $('#portfolioStateFilter').value : '';
    return portfolioCache.filter((item) => {
      if (owner && ownerKey(item) !== owner) return false;
      if (category && item.category !== category && item.subcategory !== category) return false;
      if (!matchesLocalStateFilter(item, stateFilter)) return false;
      const searchable = `${item.code} ${item.name} ${item.address} ${item.collector} ${item.category} ${item.subcategory} ${localFieldStatus(item)} ${item.fieldNote || ''}`.toLocaleLowerCase('es');
      return !query || searchable.includes(query);
    });
  }

    const container = $('#portfolioQuickFilters');
    if (!container) return;
    const counts = computeStateCounts(portfolioCache);
    const activeFilter = $('#portfolioStateFilter') ? $('#portfolioStateFilter').value : '';
    const pills = [
      { value: '', label: `Todos (${counts.total})`, className: '' },

      { value: 'pending_any', label: `Con pautas pendientes (${counts.pending_any})`, className: 'pill-pending' },
      { value: 'pending_partial', label: `Avance parcial (${counts.pending_partial})`, className: 'pill-partial' },
      { value: 'complete', label: `Pautas completas (${counts.complete})`, className: 'pill-complete' },
      { value: 'closed_or_rejected', label: `Cerrado / Rechazo (${counts.closed_or_rejected})`, className: 'pill-incident' },

    pills.forEach((pill) => {

  function boardCard(item, showOwner) {
    const status = localFieldStatus(item);
    const card = element('article', `board-card${status === 'Cerrado' ? ' is-closed' : status === 'Rechazo' ? ' is-rejected' : ''}`);
    card.draggable = true;
    card.dataset.code = item.code;
    card.classList.toggle('is-selected', selectedCodes.has(item.code));
    card.classList.toggle('is-open', detailCode === item.code);
    const check = document.createElement('input');
    check.type = 'checkbox';
    check.className = 'card-check';
    check.checked = selectedCodes.has(item.code);
    check.setAttribute('aria-label', `Seleccionar ${item.code} ${item.name}`);
    const open = element('button', 'card-open');
    open.type = 'button';
    open.append(element('strong', '', item.code), document.createTextNode(` ${item.name}`));
    const meta = element('p', 'card-meta', item.address || 'Dirección no registrada');
    const foot = element('p', 'card-foot');
    const localType = [item.category, item.subcategory].filter(Boolean).join(' · ');
    if (localType) foot.append(element('span', 'category-tag', localType));
    if (showOwner) foot.append(element('span', `owner-tag${item.collector ? '' : ' is-empty'}`, item.collector || 'Sin asignar'));
    if (status === 'Cerrado' || status === 'Rechazo') {
      foot.append(element('span', `field-tag ${status === 'Cerrado' ? 'is-closed' : 'is-rejected'}`, status));
    }
    if (item.capture) {
      foot.append(element('span', evidenceBadgeClass(item), captureSummary(item)));
    }
    card.append(check, open, meta);
    if (status !== 'Operativo' && item.fieldNote) {
      card.append(element('p', 'card-field-note', `Observación: ${item.fieldNote}`));
    } else if (status === 'Operativo' && item.capture && item.capture.recordedCount > 0 && item.capture.recordedCount < item.capture.requiredCount) {
      const pending = pendingInstrumentLabels(item);
      if (pending.length) {
        card.append(element('p', 'card-pending-note', `Faltan: ${pending.join(', ')}`));
      }
    }
    card.append(foot);
    return card;
  }
